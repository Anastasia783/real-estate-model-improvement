name: real-estate-improvement

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mlflow
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_user -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://project_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:?Set S3 endpoint}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set S3 access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set S3 secret key}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ru-central1}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:?Set artifact root}
    command:
      - /bin/sh
      - -c
      - >-
        exec mlflow server
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --default-artifact-root "$$MLFLOW_ARTIFACT_ROOT"
        --no-serve-artifacts
        --host 0.0.0.0
        --port 5000
        --workers 1
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  postgres_data:
